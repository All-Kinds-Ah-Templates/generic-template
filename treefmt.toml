[formatter.dprint-check]
command = "dprint"
options = ["check"]
excludes = []
includes = ["*.yaml", "*.yml", "*.js", "*.ts"]

[formatter.dprint-format]
command = "dprint"
options = ["fmt"]
excludes = []
includes = ["*.yaml", "*.yml", "*.js", "*.ts"]

[formatter.oxfmt-check]
command = "oxfmt"
options = ["check"]
excludes = []
includes = ["*.js", "*.ts"]

[formatter.oxfmt-format]
command = "oxfmt"
options = []
excludes = []
includes = ["*.js", "*.ts"]

[formatter.workflows-check]
command = "github-ci"
options = ["lint"]
excludes = []
includes = [".github/workflows/*.yaml"]

[formatter.workflows-format]
command = "github-ci"
options = ["lint", "--fix"]
excludes = []
includes = [".github/workflows/*.yaml"]
