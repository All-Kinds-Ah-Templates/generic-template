version: "3"

env:
  #ENV: dev
  #ENV: testing
  #ENV: staging
  ENV: production

dotenv: [".env", "{{ .taskEnv }}"]

vars:
  project: Hello World
  homepage: https://example.com
  forums: https://example.com/forums
  chat: https://chat.example.com
  ircserver: irc.libera.chat
  ircroom: help
  homepage: https://example.com
  author: Acme Inc.
  version: 0.0.1
  build:
    sh: "[ -d .git ] && git rev-parse --short HEAD || echo dev"
  date:
    sh: date -Ins
  license: MIT
  user:
    sh: id -u -n
  hostname:
    sh: hostname
  taskEnv: .task.env

tasks:
  default:
    requires:
      vars:
        - name: ENV
        - enum: [development, dev, staging, stage, production, prod]
    cmds:
      - task: hello

  hello:
    desc: "Display project welcome message"
    summary: |
      Display project information and welcome message

      This is space for a longer description.
    cmds:
      - cmd: echo "Hello {{ .fullname }}!"
        silent: true
      - cmd: echo -e "\nRun `just help` to get started."
        silent: true
      - cmd: just help
        silent: true

  help:
    desc: "Getting Started"
    cmds:
      - echo "Getting started..."

  plan:
    desc: "Plan"
    cmds:
      - 'echo "Default task: build"'
      - task --list | grep build

  build:
    desc: "Build"
    deps: ["build:templates"]
    cmds:
      - echo Build...
      - for:
          matrix:
            OS: [windows, linux, darwin]
            ARCH: [amd64, arm64]
        cmd: echo "{{.ITEM.OS}}/{{.ITEM.ARCH}}"
      - defer: { task: cleanup }

  build:templates:
    desc: "Compile templates"
    sources:
      - "**/*.j2"
    cmds:
      - for: sources
        cmd: minijinja-cli --strict --format toml --output $(basename {{ .ITEM }} .j2) {{ .ITEM }} variables.toml

  test:
    desc: "Run tests"
    deps: ["test:code", "test:scripts", "test:apis"]

  test:code:
    desc: "Test code"
    cmds:
      - task: run:pipelight:tests

  test:scripts:
    desc: "Test using scripts"
    cmds:
      - task: run:venom

  test:apis:
    desc: "Test APIs"
    cmds:
      - task: run:hurl

  coverage:
    desc: "Generate code coverage report"
    deps: ["coverage:rust"]

  coverage:rust:
    desc: "Generate code coverage report"
    generates:
      - "./codecov.json"
    sources:
      - "**/*.rs"
    cmds:
      - cargo llvm-cov nextest --all-features --workspace --codecov --output-path ./codecov.json

  run:pipelight:tests:
    desc: "Run pipelight tests"
    cmds:
      - pipelight run tests --attach
      - pipelight logs -vv

  run:venom:
    desc: "Run venom scripted tests"
    cmds:
      - if [ ! -f variables.yaml ]; then echo '---' > variables.yaml ; fi
      - venom run --output-dir results --html-report --var-from-file variables.yaml **/*.yaml
      - mv results/test_results.html results/index.html
      - cat results/test_results_venom.json | jq
      - echo www --port 4001 results

  run:hurl:
    desc: "Run hurl API tests"
    cmds:
      - hurl --test --parallel --glob *hurl.yaml --report-html results --report-json results
      - cat results/report.json | jq
      - echo www --port 4002 results

  clean:
    desc: "Clean up"
    deps: ["run:swab", "run:mise-clean"]

  run:swab:
    desc: "Run swab"
    cmds:
      - swab

  run:mise-clean:
    desc: "Run mise clean"
    status:
      - test ! -f .mise.toml
    cmds:
      - mise prune
      - mise cache clear

  lint:
    desc: "Lint code"
    deps: ["run:lychee", "run:todos", "run:oxlint", "run:zenv"]

  run:lychee:
    desc: "Run lychee link checker"
    sources:
      - "**/*.md"
    cmds:
      - for: sources
        cmd: if ! test "$PWD" != "${PWD%node_modules*}" ; echo lychee {{ .ITEM }} ; fi

  run:todos:
    desc: "Run todo checker"
    cmds:
      - todo-tree

  run:oxlint:
    desc: "Run oxlint"
    cmds:
      - oxlint

  run:zenv:
    desc: "Run zenv"
    cmds:
      - zenv check

  format:
    desc: "Format code"
    deps: ["run:treefmt"]

  run:treefmt:
    desc: "Run treefmt"
    cmds:
      - treefmt
    # for v2: treefmt --on-unmatched=info

  docs:
    desc: "Build documentation pages"
    deps: ["run:scdoc", "run:rustdoc", "run:mdbook", "run:doctave", "run:ddoc", "run:docapella", "run:zola", "run:pagoda"]

  run:scdoc:
    desc: "Build scdoc man pages"
    generates:
      - "./docs/technical/manpages"
    sources:
      - "**/*.scdoc"
    vars:
      build_dir: ../../../build/output/docs/technical/scdoc
    cmds:
      - echo Building scdoc...
      - for: sources
        cmd: scdoc < {{ .ITEM }} > {{ .build_dir }}/{{ .ITEM | filepath.Base | strings.TrimSuffix ".scdoc" }}.1

  run:rustdoc:
    desc: "Build rustdoc technical manual"
    generates:
      - "./docs/technical/rustdoc"
    preconditions:
      - test -f Cargo.toml
    vars:
      PKG_NAME:
        sh: cargo get package.name
      build_dir: ../../../build/output/docs/technical/rustdoc
    cmds:
      - echo Building rustdoc...
      - cargo doc
      - mkdir -p {{.build_dir}} ; mv target/doc/{{.PKG_NAME}}/* {{.build_dir}}/ ; rmdir target/doc/{{.PKG_NAME}} ; mv target/doc/* {{.build_dir}}/
      - "echo Start server: www --root {{.build_dir}} --port 4000"

  run:mdbook:
    desc: "Build mdbook technical notes"
    generates:
      - "./docs/technical/mdbook"
    cmds:
      - echo Building mdbook...
      - cd docs/technical/mdbook ; mkdir -p ../../../build/output/docs/technical/mdbook ; mdbook build --dest-dir ../../../build/output/docs/technical/mdbook
      - "echo Start server: mdbook serve --dest-dir ../../../build/output/docs/technical/mdbook --port 4001"

  run:docapella:
    desc: "Build docapella OpenAPI docs"
    generates:
      - "./docs/technical/docapella"
    cmds:
      - echo Building docapella...
      - cd docs/technical/docapella ; mkdir -p ../../../build/output/docs/technical/docapella ; docapella build ; mv _build ../../../build/output/docs/technical/docapella
      - "echo Start server: www --port 4002 ../../../build/output/docs/technical/docapella"

  run:doctave:
    desc: "Build doctave user guides"
    generates:
      - "./docs/user-guides/doctave"
    vars:
      build_dir: ../../../build/output/docs/user-guides/doctave
    cmds:
      - echo Building doctave...
      - |
        cat > doctave.yaml <<EOL
        name: {{.project}}
        version: {{.version}}
        build_dir: {{.build_dir}}
        EOL
      - cd docs/user-guides/doctave ; doctave build --release
      - "echo Start server: doctave serve --port 4003"

  run:ddoc:
    desc: "Build ddoc install instructions"
    generates:
      - "./docs/user-guides/ddoc"
    preconditions:
      - test -d docs/user-guides/ddoc
    vars:
      build_dir: ../../../build/output/docs/user-guides/ddoc
    cmds:
      - echo Building ddoc...
      - mkdir -p {{.build_dir}} ; cp -a docs/user-guides/ddoc/* {{.build_dir}}/
      - 'echo Start server: cd {{.build_dir}} ; ddoc --serve --port 4004'

  #run:docusourus:
  #desc: "Build docusourus user guides"
  #vars:
  #GIT_OWNER:
  #sh: git remote get-url origin | grep owner
  #GIT_PROJECT:
  #sh: git remote get-url origin | grep owner
  #generates:
  #- './docs/user-guides/docusourus'
  #cmds:
  #- echo Building docusourus...
