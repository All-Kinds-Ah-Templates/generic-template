  #- 'sd --fixed-strings "facebook/docusourus" "{{.GIT_OWNER}}/{{.GIT_PROJECT}}" docusaurus.config.ts'
  #- 'sd "organizationName: .facebook." "{{.GIT_OWNER}}" docusaurus.config.ts'
  #- yarn build
  #- 'echo Start server: www --port 4005 build'

  #run:rspress:
  #  desc: "Build rspress user guides"
  #  generates:
  #    - "./docs/user-guides/rspress-site"
  #  interactive: true
  #  cmds:
  #    - echo Building rspress-site...
  #    - if [ ! -d rspress-site ]; then bun create -y rspress@latest ; fi
  #    - cd rspress-site
  #    - cp ../rspress.config.ts .
  #    - bun install
  #    - bun run build
  #    - "echo Start server: www --port 4005 build"

  run:dodeca:
    desc: "Build dodeca release notes"
    generates:
      - "./docs/blog/dodeca"
    vars:
      build_dir: ../../../build/output/docs/release-notes/dodeca
    cmds:
      - echo Building dodeca...
      - if [ ! -d dodeca ]; then mkdir -p docs/release-notes ; cd docs/release-notes ; ddc init dodeca ; fi
      - cd docs/release-notes/dodeca ; mkdir -p {{ .build_dir }} ; ddc build --output {{ .build_dir }}
      - 'echo Start server: www --port 4005 {{ .build_dir }}'

  run:zola:
    desc: "Build zola blog"
    generates:
      - "./docs/blog/zola"
    vars:
      build_dir: ../../../build/output/docs/blog/zola
    cmds:
      - echo Building zola...
      - if [ ! -d zola ]; then mkdir -p docs/blog ; cd docs/blog ; zola init zola ; fi
      - cd docs/blog/zola ; mkdir -p {{ .build_dir }} ; zola build --force --base-url https://localhost:4006 --output-dir {{ .build_dir }}
      - 'echo Start server: www --port 4006 {{ .build_dir }}'

  run:pagoda:
    desc: "Build pagoda site"
    generates:
      - "./docs/portal/pagoda"
    cmds:
      - echo Building pagoda...
      - if [ ! -d pagoda ]; then pagoda init pagoda ; fi
      - cd pagoda
      - PAGODA_HTTP_PORT=4007 pagoda serve

  audit:
    desc: "Perform a security audit"
    deps: ["audit:secrets", "audit:vulnerabilities", "audit:code-quality", "audit:deps", "audit:license", "audit:bloat"]

  audit:secrets:
    desc: "Scan for secrets"
    cmds:
      - task: run:trufflehog

  run:trufflehog:
    desc: "Run trufflehog"
    summary: |
      Scan for:

      - 700 credential detectors that support active verification against their respective APIs.
      - GitHub, GitLab, Docker, filesystems, S3, GCS, Circle CI and Travis CI.
      - Instantly verify private keys against millions of GitHub users and billions of TLS certificates
      - Scan binaries and documents

    cmds:
      - trufflehog git file://. --since-commit HEAD --only-verified --no-update --fail

  audit:vulnerabilities:
    desc: "Scan for vulnerabilities"
    cmds:
      - task: run:trivy

  run:trivy:
    desc: "Run trivy"
    summary: |
      Scan for:

      OS packages and software dependencies in use (SBOM)
      Known vulnerabilities (CVEs)
      IaC issues and misconfigurations
      Sensitive information and secrets
      Software licenses
    cmds:
      - trivy fs --scanners vuln,secret,misconfig --exit-code 183 .

  audit:code-quality:
    desc: "Look for code smells"
    deps: ["run:sonarcube", "run:zizmor"]

  run:sonarcube:
    desc: "Run sonarcube"
    cmds:
      - echo sonarcube run

  run:zizmor:
    desc: "Run zizmor"
    cmds:
      - zizmor --pedantic .github/workflows

  audit:deps:
    desc: "Detect unused dependencies and errors"
    deps:
      - task: run:cargo-check
      - task: run:cargo-audit
      - task: run:cargo-machete
      - task: run:cargo-udeps

  run:cargo-check:
    desc: "Run cargo-check"
    cmds:
      - echo cargo check

  run:cargo-audit:
    desc: "Run cargo-audit"
    cmds:
      - echo cargo audit

  run:cargo-machete:
    desc: "Run cargo-machete"
    cmds:
      - echo cargo machete

  run:cargo-udeps:
    desc: "Run cargo-udeps"
    cmds:
      - echo cargo udeps

  audit:license:
    desc: "Find banned licenses."
    deps:
      - task: run:cargo-license
      - task: run:cargo-deny
      - task: run:feluda

  run:cargo-license:
    desc: "Run cargo-license"
    cmds:
      - echo cargo license --authors --do-not-bundle

  run:cargo-deny:
    desc: "Run cargo-deny"
    cmds:
      - echo cargo deny check licenses bans

  run:feluda:
    desc: "Run feluda"
    cmds:
      - echo feluda

  audit:bloat:
    desc: "Measure amount of bloat"
    deps:
      - task: run:cargo-bloat

  run:cargo-bloat:
    desc: "Run cargo-bloat"
    cmds:
      - echo cargo bloat --release --crunch

  fix:
    desc: "Format files"
    deps: ["run:cargo-fmt", "run:cargo-clippy", "run:copilot"]

  run:cargo-fmt:
    desc: "Run cargo-fmt"
    cmds:
      - cargo fmt --all

  run:cargo-clippy:
    desc: "Run cargo-clippy"
    cmds:
      - cargo clippy --fix --allow-dirty

  run:copilot:
    desc: "Run copilot"
    status:
      - "! command -v copilot"
    cmds:
      - copilot -p "fix all build errors and warnings" --allow-all-tools

  doctor:
    desc: "Doctor diagnostics"
    #deps: ["run:doctor-just", "run:doctor-task", "run:doctor-mise"]
    cmds:
      - cmd:
        |
          printf "\n\n=== Just Doctor ===\n\n"
          if ! command -v just >/dev/null 2>&1; then
            echo "Error: just is not installed."
            return 1
          fi
          echo Found $(just -l | wc -l) recipes

          printf "\n\n=== Taskfile Doctor ===\n\n"
          if ! command -v task >/dev/null 2>&1; then
            printf "Error: task is not installed."
            return 1
          fi
          echo Found $(task -l | wc -l) tasks

          if [ -f mise.yml ] && command -v mise >/dev/null 2>&1; then
            printf "\n\n=== Mise Doctor ===\n\n"
            mise tasks
            mise list
            mise doctor
          fi

          if [ -f pipelight.yml ] && command -v pipelight >/dev/null 2>&1; then
            printf "\n\n=== Pipelight Doctor ===\n\n"
            pipelight ls
          fi

          if [ -f .lefthook.yml ] && command -v lefthook >/dev/null 2>&1; then
            printf "\n\n=== Lefthook Doctor ===\n\n"
            lefthook validate
          fi

          if [ -f .pre-commit-config.yaml ] && command -v prek >/dev/null 2>&1; then
            printf "\n\n=== Prek Doctor ===\n\n"
            prek list
          fi

          if [ -f setup.yaml ] && command -v comtrya >/dev/null 2>&1; then
            printf "\n\n=== Comtrya Doctor ===\n\n"
            comtrya -d manifests status
          fi

          if [ -f .goji.json ] && command -v goji >/dev/null 2>&1; then
            printf "\n\n=== Goji Doctor ===\n\n"
            COUNT=$(jq '.types | length' < .goji.json)
            printf "Found $COUNT goji types."
          fi

          if [ -f preflight.yml ] && command -v preflight >/dev/null 2>&1; then
            printf "\n\n=== Preflight Doctor ===\n\n"
            preflight checks
          fi
        silent: true

  upgrade:
    desc: "Perform upgrades"
    deps: ["upgrade:tools", "upgrade:workflows"]

  upgrade:tools:
    desc: "Upgrade tools"
    deps: ["run:mise-up"]

  run:mise-up:
    desc: "Run mise up"
    cmds:
      - mise up --bump

  upgrade:workflows:
    desc: "Upgrade workflows"
    deps: ["run:github-ci-upgrade"]

  run:github-ci-upgrade:
    desc: "Run github-ci upgrade"
    cmds:
      - github-ci upgrade

  bump:
    desc: "Bump version (patch, minor, or major)"
    cmds:
      - task: run:yatr-bump

  run:yatr-bump:
    desc: "Run yatr bump version"
    vars:
      PART: '{{.PART | default "patch"}}'
    preconditions:
      - sh: command -v yatr
        msg: "yatr command not found. Please install yatr first (cargo install --git https://github.com/yonasBSD/yatr)."
    cmds:
      - |
        if [ "{{.PART}}" != "patch" ] && [ "{{.PART}}" != "minor" ] && [ "{{.PART}}" != "major" ]; then
          echo "Error: PART must be one of: patch, minor, major"
          exit 1
        fi
      - echo "Bump {{.PART}} version..."
      - yatr bump-{{.PART}}
