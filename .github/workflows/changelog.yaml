name: Generate Changelog

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight
  workflow_dispatch: # Manual override

jobs:
  changelog:
    name: Generate and publish changelog
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install git-cliff
        run: |
          latest=$(curl -s https://api.github.com/repos/orhun/git-cliff/releases/latest | jq -r .tag_name)
          curl -L "https://github.com/orhun/git-cliff/releases/download/${latest}/git-cliff-${latest}-x86_64-unknown-linux-gnu.tar.gz" \
          | tar -xz
          sudo mv git-cliff /usr/local/bin/

      - name: Generate CHANGELOG.md
        run: |
          git-cliff --output CHANGELOG.md

      - name: Commit changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore: Update CHANGELOG.md" || echo "No changes to commit"

      - name: Push changes
        run: |
          git push
