name: Security Scan

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  trivy:
    name: 🛡️ Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: 🏁 Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # --- TTL Cache Logic ---
      # This generates a string like '2026-01-30'.
      # By including this in the key, we force a fresh cache entry every day.
      - name: 🗓️ Get Date
        id: get-date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: 💾 Cache Trivy DB (Daily TTL)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4.2.0
        with:
          path: .cache/trivy
          # Key includes the date for TTL, Restore-keys allow grabbing yesterday's DB to fetch only diffs.
          key: ${{ runner.os }}-trivy-${{ steps.get-date.outputs.date }}
          restore-keys: |
            ${{ runner.os }}-trivy-

      - name: 🔍 Run Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0"
          cache-dir: .cache/trivy

      - name: 📤 Upload results to GitHub Security
        uses: github/codeql-action/upload-sarif@cf1bb45a277cb3c205638b2cd5c984db1c46a412 # v4.31.7
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

  trufflehog:
    name: 🕵️ Secret Scan (TruffleHog)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write

    steps:
      - name: 🏁 Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🕵️ Run TruffleHog OSS
        uses: trufflesecurity/trufflehog@30d5bb91af1a771378349dbbb0c82129392acf70 # v3.95.6
        with:
          extra_args: --results=verified,unknown
