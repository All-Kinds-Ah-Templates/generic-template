name: PR Build

on:
  # The use of pull_request_target here is intentional for elevated permissions
  # but must be secured (as it is, by using the 'needs-build' label check).
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [labeled, synchronize]

jobs:
  build:
    # 1. Permission block moved here, isolating permissions to this job.
    permissions:
      contents: read
      pull-requests: write
      # Note: The checkout step uses the GITHUB_TOKEN provided by this block.

    # 2. Ensures the job only runs when the 'needs-build' label is present.
    if: contains(github.event.pull_request.labels.*.name, 'needs-build')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # This is the key security measure for pull_request_target:
          # You check out the code of the PR (head.sha), but the job runs
          # with the base repo's permissions. The 'needs-build' label acts as a
          # manual human gate to approve running potentially malicious code.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Release Build
        uses: yonasBSD/toolkit@7757e45441401d468ec049000c61571426a47de4 # v1.0.0
        with:
          run: |
            cargo auditable build --release

      - name: Fetch Latest NFPM Version
        id: fetch_version
        run: |
          LATEST_RELEASE=$(curl -sL https://api.github.com/repos/goreleaser/nfpm/releases/latest)
          VERSION=$(echo "$LATEST_RELEASE" | jq -r ".tag_name" | cut -d'v' -f2)
          echo "NFPM_VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Packages
        env:
          # Using github.event.pull_request.head.ref is safer than github.ref_name for PRs
          VERSION: ${{ github.event.pull_request.head.ref }}
          NFPM_VERSION: ${{ steps.fetch_version.outputs.NFPM_VERSION }}
        run: |
          wget https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb
          sudo dpkg -i nfpm_${NFPM_VERSION}_amd64.deb
          rm nfpm_${NFPM_VERSION}_amd64.deb
          sed -i -E "s/^version:.+$/version: $VERSION/g" nfpm.yaml
          mkdir scripts
          touch foo bar scripts/postremove.sh scripts/preremove.sh scripts/preinstall.sh scripts/postinstall.sh changelog.yaml foobar.conf
          for pkg in deb apk archlinux rpm ipk; do
            nfpm package -p $pkg
          done

      - name: Upload Artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        id: artifact-upload-step
        with:
          name: ${{ env.PROJECT_NAME_UNDERSCORE }}
          path: |
            *.deb
            *.apk
            *.ipk
            *.rpm
            *.zst

      - uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        id: find-comment
        with:
          # This uses the GITHUB_TOKEN provided by the job's permissions block
          token: ${{ secrets.GH_PAT || github.token }}
          issue-number: ${{ github.event.pull_request.number }}
          body-includes: '📦 Build artifacts ready!'

      - uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          # This uses the GITHUB_TOKEN provided by the job's permissions block
          token: ${{ secrets.GH_PAT || github.token }}
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## 📦 Build artifacts ready!
            Download binaries from [this workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          edit-mode: replace
