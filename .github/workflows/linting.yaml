---
name: Linting

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read
  packages: read
  statuses: write

jobs:
  super-linter:
    name: Super Linter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Super-linter
        uses: github/super-linter@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  conventional_commits:
    name: Check conventional commit compliance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Conventional commit check
        uses: cocogitto/cocogitto-action@main

  spellchecking:
    name: Spell checking and corrections
    runs-on: ubuntu-latest

    steps:
      - name: Writes changes in the local checkout
        uses: crate-ci/typos@master
        with:
          write_changes: true

  zizmor:
    name: Static analysis tool for GitHub Actions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Run zizmor 🌈
        uses: zizmorcore/zizmor-action@f52a838cfabf134edcbaa7c8b3677dde20045018 # v0.1.1

  todo-list:
    name: Remaining Todos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Cocogitto
        run: cargo binstall -y todo-tree

      - name: List Todos
        run: |
          SUMMARY_FILE=$GITHUB_STEP_SUMMARY
          TODO_OUTPUT=$(todo-tree list)

          # Check if output is empty and provide a clear success message if so.
          if [ -z "$TODO_OUTPUT" ]; then
            echo "## 🌳 TODO-Tree Code Review Report" >> $SUMMARY_FILE
            echo "" >> $SUMMARY_FILE
            echo "✅ **Success**" >> $SUMMARY_FILE
            exit 0
          fi

          # --- END: Execute todo-tree command ---

          # 1. Add a descriptive Markdown header to the Summary page
          echo "## 🌳 TODO-Tree Code Review Report" >> $SUMMARY_FILE
          echo "" >> $SUMMARY_FILE

          # 2. Append the raw output directly (preserves ANSI colors)
          todo-tree list --case-sensitive >> $SUMMARY_FILE
          todo-tree stats >> $SUMMARY_FILE
