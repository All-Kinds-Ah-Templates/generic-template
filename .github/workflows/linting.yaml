---
name: Linting

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read
  packages: read
  statuses: write

jobs:
  super-linter:
    name: Super Linter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Super-linter
        uses: github/super-linter@b807e99ddd37e444d189cfd2c2ca1274d8ae8ef1 # v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  conventional_commits:
    name: Check conventional commit compliance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Conventional commit check
        uses: cocogitto/cocogitto-action@9a9fe03b31c47444290c0d7f9b1ee1b44ee13f20 # main

  spellchecking:
    name: Spell checking and corrections
    runs-on: ubuntu-latest

    steps:
      - name: Writes changes in the local checkout
        uses: crate-ci/typos@24c5854966d17070a3b25e2c2dfc63ec5bc94cf4 # v1.40.0
        with:
          write_changes: true

  zizmor:
    name: Static analysis tool for GitHub Actions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Run zizmor 🌈
        uses: zizmorcore/zizmor-action@e639db99335bc9038abc0e066dfcd72e23d26fb4 # v0.3.0

  todo-list:
    name: Remaining Todos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@4a9028576ed64318f7b24193a62695e96dcbe015 # main

      - name: Install Cocogitto
        run: cargo binstall -y todo-tree

      - name: List Todos
        run: |
          SUMMARY_FILE=$GITHUB_STEP_SUMMARY
          TODO_OUTPUT=$(todo-tree list)

          # Check if output is empty and provide a clear success message if so.
          if [ -z "$TODO_OUTPUT" ]; then
            echo "## 🌳 TODO-Tree Code Review Report" >> $SUMMARY_FILE
            echo "" >> $SUMMARY_FILE
            echo "✅ **Success**" >> $SUMMARY_FILE
            exit 0
          fi

          # --- END: Execute todo-tree command ---

          # 1. Add a descriptive Markdown header to the Summary page
          echo "## 🌳 TODO-Tree Code Review Report" >> $SUMMARY_FILE
          echo "" >> $SUMMARY_FILE

          # 2. Append the raw output directly (preserves ANSI colors)
          todo-tree list --case-sensitive >> $SUMMARY_FILE
          todo-tree stats >> $SUMMARY_FILE
