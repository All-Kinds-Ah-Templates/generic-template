---
name: Linting

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read
  packages: read
  statuses: write

jobs:
  super-linter:
    name: Super Linter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Super-linter
        uses: github/super-linter@b807e99ddd37e444d189cfd2c2ca1274d8ae8ef1 # v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  conventional-commits:
    name: Check conventional commit compliance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Conventional commit check
        uses: cocogitto/cocogitto-action@52d0023b4396897f1815648e553db2ab8d782f3a # main
        with:
          command: check

  spellchecking:
    name: Spell checking and corrections
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Writes changes in the local checkout
        uses: crate-ci/typos@02ea592e44b3a53c302f697cddca7641cd051c3d # v1.45.0
        with:
          write_changes: true

  zizmor:
    name: Static analysis tool for GitHub Actions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Run zizmor 🌈
        uses: zizmorcore/zizmor-action@71321a20a9ded102f6e9ce5718a2fcec2c4f70d8 # v0.5.2

  todo-list:
    name: Remaining Todos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: nightly

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@0b24824336e2b3800b0f89d9e08b2c08bfa3dcdd # main

      - name: Install Cocogitto
        run: cargo binstall -y todo-tree

      - name: List Todos
        run: |
          SUMMARY_FILE=$GITHUB_STEP_SUMMARY
          TODO_OUTPUT=$(todo-tree list)

          # Check if output is empty and provide a clear success message if so.
          if [ -z "$TODO_OUTPUT" ]; then
            echo "## 🌳 TODO-Tree Code Review Report" >> $SUMMARY_FILE
            echo "" >> $SUMMARY_FILE
            echo "✅ **Success**" >> $SUMMARY_FILE
            exit 0
          fi

          # --- END: Execute todo-tree command ---

          # 1. Add a descriptive Markdown header to the Summary page
          echo "## 🌳 TODO-Tree Code Review Report" >> $SUMMARY_FILE
          echo "" >> $SUMMARY_FILE

          # 2. Append the raw output directly (preserves ANSI colors)
          todo-tree list --case-sensitive >> $SUMMARY_FILE
          todo-tree stats >> $SUMMARY_FILE
