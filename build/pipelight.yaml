pipelines:
  - name: build

    triggers:
      - actions:
          - pre-commit

    steps:
      - name: Build
        commands:
          - task --verbose build

  - name: tests

    steps:
      - name: Run unit tests
        commands:
          # test binaries, examples, benches, and libraries
          - cargo nextest run --workspace --all --all-targets --all-features --no-fail-fast --no-tests=pass

  - name: docs

    triggers:
      - actions:
          - pre-commit

    steps:
      - name: Build documentation pages
        commands:
          - task --verbose docs
