pipelines:
  - name: build

    triggers:
      - actions:
          - pre-commit

    steps:
      - name: Build
        commands:
          - task --verbose build

  - name: tests

    steps:
      - name: Run unit tests
        commands:
          # test binaries, examples, benches, and libraries
          - cargo nextest --no-fail-fast --all --all-features --all-targets --verbose

  - name: docs

    triggers:
      - actions:
          - pre-commit

    steps:
      - name: Build documentation pages
        commands:
          - task --verbose docs
